<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STREAMS Agent</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; color: #1a1a1a; }
    h1 { font-size: 1.5rem; margin-bottom: 4px; }
    h2 { font-size: 1.1rem; margin-top: 32px; margin-bottom: 12px; color: #374151; }
    .subtitle { color: #666; margin-bottom: 24px; font-size: 0.9rem; }
    label { display: block; font-weight: 600; margin-bottom: 4px; margin-top: 16px; }
    input[type="text"], input[type="file"], select { width: 100%; padding: 8px 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 0.95rem; }
    select { background: white; }
    button { padding: 10px 24px; background: #2563eb; color: white; border: none; border-radius: 6px; font-size: 1rem; cursor: pointer; }
    button:hover { background: #1d4ed8; }
    button:disabled { background: #94a3b8; cursor: not-allowed; }
    .btn-sm { padding: 4px 12px; font-size: 0.85rem; }

    /* Auth bar */
    .auth-bar { display: flex; justify-content: flex-end; align-items: center; gap: 12px; margin-bottom: 20px; padding: 10px 14px; background: #f9fafb; border-radius: 8px; border: 1px solid #e5e7eb; font-size: 0.9rem; }
    .auth-bar .user-info { color: #374151; }
    .auth-bar .orcid-id { font-family: monospace; color: #059669; }
    .auth-bar a { color: #2563eb; text-decoration: none; }
    .auth-bar a:hover { text-decoration: underline; }
    .anon-notice { color: #d97706; font-size: 0.85rem; }

    /* Credits badge */
    .credits-badge { padding: 4px 10px; border-radius: 12px; font-size: 0.8rem; font-weight: 600; }
    .credits-green { background: #d1fae5; color: #065f46; }
    .credits-yellow { background: #fef3c7; color: #92400e; }
    .credits-red { background: #fee2e2; color: #991b1b; }

    /* Rate limit warning */
    .rate-warning { background: #fef3c7; border: 1px solid #f59e0b; padding: 10px 14px; border-radius: 6px; margin-top: 12px; font-size: 0.9rem; color: #92400e; display: none; }
    .rate-warning.visible { display: block; }

    /* Extracting indicator */
    .extracting { color: #6b7280; font-size: 0.85rem; margin-top: 4px; display: none; }
    .extracting.visible { display: block; }

    /* Model cost hint */
    .model-hint { color: #6b7280; font-size: 0.8rem; margin-top: 2px; }

    /* Jobs table */
    .jobs-table { width: 100%; border-collapse: collapse; margin-top: 8px; }
    .jobs-table th, .jobs-table td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #e5e7eb; font-size: 0.9rem; }
    .jobs-table th { background: #f9fafb; font-weight: 600; }
    .jobs-table tr:hover { background: #f9fafb; }
    .status-running { color: #d97706; font-weight: 600; }
    .status-complete { color: #059669; font-weight: 600; }
    .status-failed { color: #dc2626; font-weight: 600; }
    .no-jobs { color: #9ca3af; font-style: italic; padding: 16px 0; }

    /* Page views */
    .page { display: none; }
    .page.active { display: block; }

    /* Detail page */
    .back-link { display: inline-block; margin-bottom: 16px; color: #2563eb; text-decoration: none; font-size: 0.9rem; cursor: pointer; }
    .back-link:hover { text-decoration: underline; }
    .detail-title { font-size: 1.3rem; font-weight: 600; margin-bottom: 16px; }
    .detail-meta { font-size: 0.85rem; color: #6b7280; margin-bottom: 16px; }
    .detail-meta span { margin-right: 16px; }
    .trace-link { display: inline-block; margin-bottom: 16px; color: #2563eb; text-decoration: none; font-size: 0.9rem; }
    .trace-link:hover { text-decoration: underline; }

    /* Results */
    .results-table { width: 100%; border-collapse: collapse; margin-top: 12px; }
    .results-table th, .results-table td { text-align: left; padding: 6px 10px; border-bottom: 1px solid #e5e7eb; font-size: 0.9rem; }
    .results-table th { background: #f9fafb; }
    .rating-yes { color: #059669; font-weight: 600; }
    .rating-no { color: #dc2626; font-weight: 600; }
    .rating-partial { color: #d97706; font-weight: 600; }
    .rating-na { color: #6b7280; }
    .summary { display: flex; gap: 12px; margin-top: 8px; flex-wrap: wrap; }
    .summary-item { padding: 6px 12px; border-radius: 6px; background: #f9fafb; font-size: 0.85rem; border: 1px solid #e5e7eb; }

    /* Error log */
    .error-log { background: #1e1e1e; color: #f0f0f0; padding: 16px; border-radius: 6px; font-family: monospace; font-size: 0.8rem; white-space: pre-wrap; word-break: break-all; max-height: 400px; overflow-y: auto; margin-top: 12px; }

    /* Testing section */
    .testing-toggle { color: #6b7280; font-size: 0.8rem; cursor: pointer; margin-top: 12px; user-select: none; }
    .testing-toggle:hover { color: #374151; }
    .testing-section { display: none; margin-top: 8px; padding: 12px; background: #fefce8; border: 1px dashed #d97706; border-radius: 6px; }
    .testing-section.visible { display: block; }
    .testing-section label { font-size: 0.85rem; color: #92400e; margin-top: 0; }
    .testing-section input[type="password"] { width: 100%; padding: 6px 10px; border: 1px solid #d97706; border-radius: 4px; font-size: 0.85rem; font-family: monospace; }
    .testing-section .hint { color: #92400e; font-size: 0.75rem; margin-top: 4px; }
  </style>
</head>
<body>
  <div class="auth-bar" id="auth-bar">
    <span id="auth-status">Loading...</span>
  </div>

  <!-- PAGE: Jobs list -->
  <div id="page-jobs" class="page active">
    <h1>STREAMS Agent</h1>
    <p class="subtitle">Evaluate microbiome papers against the STREAMS checklist</p>

    <form id="eval-form" style="display:flex; gap:12px; align-items:end; flex-wrap:wrap;">
      <div style="flex:1; min-width:200px;">
        <label for="paper-id">Paper ID <span style="font-weight:normal; color:#9ca3af;">(auto-filled from file)</span></label>
        <input type="text" id="paper-id" placeholder="e.g. smith2024_gut_microbiome">
      </div>
      <div>
        <label for="pdf-file">Paper file</label>
        <input type="file" id="pdf-file">
      </div>
      <div>
        <label for="model-select">Model</label>
        <select id="model-select">
          <option value="haiku">Haiku (~15 credits)</option>
          <option value="sonnet">Sonnet (~90 credits)</option>
          <option value="opus">Opus (~80 credits)</option>
        </select>
        <div class="model-hint" id="model-hint"></div>
      </div>
      <button type="submit" id="submit-btn" style="margin-top:0; height:38px;">Submit</button>
    </form>
    <div class="extracting" id="extracting-indicator">Extracting title from file...</div>

    <div class="rate-warning" id="rate-warning"></div>

    <div class="testing-toggle" onclick="document.getElementById('testing-section').classList.toggle('visible')">
      &#9881; Testing options...
    </div>
    <div class="testing-section" id="testing-section">
      <label for="oauth-token-input">OAuth Token <span style="font-weight:normal;">(overrides server key — for testing only)</span></label>
      <input type="password" id="oauth-token-input" placeholder="CLAUDE_CODE_OAUTH_TOKEN">
      <div class="hint">Token is sent per-request and not stored. Bypasses budget limits when provided.</div>
      <label style="margin-top:10px;">
        <input type="checkbox" id="quick-test-check"> Quick test <span style="font-weight:normal;">(only items 1.1 &amp; 1.2 — much faster)</span>
      </label>
      <div style="margin-top:4px;">
        <label for="custom-items" style="font-size:0.8rem;">Or specify items: <span style="font-weight:normal;">comma-separated, e.g. 1.1,1.2,2.1</span></label>
        <input type="text" id="custom-items" placeholder="1.1,1.2" style="border-color:#d97706;font-size:0.85rem;">
      </div>
    </div>

    <h2>Jobs</h2>
    <div id="jobs-area">
      <p class="no-jobs">Loading...</p>
    </div>
  </div>

  <!-- PAGE: Detail view -->
  <div id="page-detail" class="page">
    <a class="back-link" onclick="showJobsPage()">&larr; Back to jobs</a>
    <div class="detail-title" id="detail-title"></div>
    <div class="detail-meta" id="detail-meta"></div>
    <div id="detail-trace-link"></div>
    <div id="detail-results"></div>
  </div>

  <script>
    const jobs = new Map();
    let pollTimer = null;
    let userCredits = null;
    let isAdmin = false;

    // --- Page navigation ---
    function showJobsPage() {
      document.getElementById("page-jobs").className = "page active";
      document.getElementById("page-detail").className = "page";
    }

    function showDetailPage() {
      document.getElementById("page-jobs").className = "page";
      document.getElementById("page-detail").className = "page active";
      window.scrollTo(0, 0);
    }

    // --- Auth ---
    async function checkAuth() {
      const resp = await fetch("/api/auth/me");
      const data = await resp.json();
      const bar = document.getElementById("auth-bar");
      isAdmin = !!data.is_admin;
      if (data.logged_in) {
        const adminBadge = isAdmin ? ' <span style="background:#7c3aed;color:white;padding:2px 6px;border-radius:4px;font-size:0.75rem;">admin</span>' : '';
        bar.innerHTML = `<span class="user-info">${data.name || "Researcher"} &middot; <span class="orcid-id">${data.orcid}</span>${adminBadge}</span> <span id="credits-badge"></span> <a href="/api/auth/logout">Sign out</a>`;
      } else {
        bar.innerHTML = `<span class="anon-notice">Anonymous (3 jobs/hour limit)</span> <span id="credits-badge"></span> <a href="/api/auth/login">Sign in with ORCID</a>`;
      }
      fetchCredits();
    }

    // --- Credits ---
    async function fetchCredits() {
      const resp = await fetch("/api/budget");
      if (!resp.ok) return;
      const data = await resp.json();
      userCredits = data;
      renderCredits();
    }

    function renderCredits() {
      const badge = document.getElementById("credits-badge");
      if (!badge || !userCredits) return;
      const remaining = Math.round(userCredits.credits_remaining);
      let cls = "credits-green";
      if (remaining <= 0) cls = "credits-red";
      else if (remaining <= 100) cls = "credits-yellow";
      badge.className = `credits-badge ${cls}`;
      badge.textContent = `${remaining} credits`;
    }

    // --- Load existing jobs on page load ---
    async function loadJobs() {
      const resp = await fetch("/api/jobs");
      if (!resp.ok) { renderJobs(); return; }
      const data = await resp.json();
      for (const job of (data.jobs || [])) {
        if (!jobs.has(job.job_id)) {
          jobs.set(job.job_id, {
            paper_id: job.paper_id,
            status: job.status,
            model: job.model || "",
            submitted_at: job.submitted_at,
            completed_at: job.completed_at,
            results: null,
          });
        }
      }
      renderJobs();
      const hasRunning = [...jobs.values()].some(j => j.status === "running");
      if (hasRunning) startPolling();
    }

    // --- File title extraction ---
    document.getElementById("pdf-file").addEventListener("change", async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const paperId = document.getElementById("paper-id");
      if (paperId.value.trim()) return;

      const indicator = document.getElementById("extracting-indicator");
      indicator.className = "extracting visible";

      const reader = new FileReader();
      reader.onload = async () => {
        const base64 = reader.result.split(",")[1];
        const resp = await fetch("/api/extract-title", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ file_bytes: base64, filename: file.name }),
        });
        indicator.className = "extracting";
        if (!resp.ok) return;
        const data = await resp.json();
        if (data.slug && !paperId.value.trim()) {
          paperId.value = data.slug;
          paperId.title = data.title;
        }
      };
      reader.readAsDataURL(file);
    });

    // --- Submit ---
    document.getElementById("eval-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const paperIdInput = document.getElementById("paper-id");
      const paperId = paperIdInput.value.trim();
      const fileInput = document.getElementById("pdf-file");
      const modelSelect = document.getElementById("model-select");
      const model = modelSelect.value;
      const btn = document.getElementById("submit-btn");

      // Validate PDF
      if (!fileInput.files || !fileInput.files[0]) {
        const warn = document.getElementById("rate-warning");
        warn.textContent = "Please select a file to upload.";
        warn.className = "rate-warning visible";
        return;
      }

      if (!paperId) {
        paperIdInput.focus();
        paperIdInput.placeholder = "Please enter a paper ID or attach a file";
        return;
      }

      btn.disabled = true;
      btn.textContent = "Uploading...";
      document.getElementById("rate-warning").className = "rate-warning";

      // Read file as base64
      const file = fileInput.files[0];
      const base64 = await new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result.split(",")[1]);
        reader.readAsDataURL(file);
      });

      btn.textContent = "Submitting...";

      const submitBody = {
        paper_id: paperId,
        model: model,
        pdf_base64: base64,
        filename: file.name,
      };
      const oauthInput = document.getElementById("oauth-token-input");
      if (oauthInput && oauthInput.value.trim()) {
        submitBody.oauth_token = oauthInput.value.trim();
      }
      const customItems = document.getElementById("custom-items").value.trim();
      const quickTest = document.getElementById("quick-test-check").checked;
      if (customItems) {
        submitBody.item_ids = customItems.split(",").map(s => s.trim()).filter(Boolean);
      } else if (quickTest) {
        submitBody.item_ids = ["1.1", "1.2"];
      }

      const resp = await fetch("/api/submit", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(submitBody),
      });

      const result = await resp.json();
      btn.disabled = false;
      btn.textContent = "Submit";

      if (result.error) {
        const warn = document.getElementById("rate-warning");
        warn.textContent = result.error;
        warn.className = "rate-warning visible";
        return;
      }

      jobs.set(result.job_id, {
        paper_id: paperId,
        status: "running",
        model: model,
        submitted_at: Date.now() / 1000,
        results: null,
      });
      paperIdInput.value = "";
      fileInput.value = "";
      renderJobs();
      startPolling();
      fetchCredits();
    });

    // --- Polling ---
    function startPolling() {
      if (pollTimer) return;
      pollTimer = setInterval(pollRunningJobs, 3000);
    }

    async function pollRunningJobs() {
      const running = [...jobs.entries()].filter(([_, j]) => j.status === "running");
      if (running.length === 0) {
        clearInterval(pollTimer);
        pollTimer = null;
        return;
      }
      for (const [jobId, job] of running) {
        const resp = await fetch("/api/status/" + jobId);
        if (!resp.ok) continue;
        const data = await resp.json();
        job.progress = data.progress || "";
        job.rated_count = data.rated_count || 0;
        job.total_items = data.total_items || 0;
        job.cost_usd = data.cost_usd;
        job.duration_s = data.duration_s;
        job.model = data.model || job.model;
        if (data.status === "complete") {
          job.status = "complete";
          job.results = data.results;
          job.completed_at = data.completed_at;
          fetchCredits();
        } else if (data.status === "failed") {
          job.status = "failed";
          job.progress = data.progress || "Failed";
          job.error_log = data.error_log || "";
        }
      }
      renderJobs();
    }

    // --- Render ---
    function renderJobs() {
      const area = document.getElementById("jobs-area");
      if (jobs.size === 0) {
        area.innerHTML = '<p class="no-jobs">No jobs submitted yet.</p>';
        return;
      }
      let html = `<table class="jobs-table">
        <thead><tr><th>Paper ID</th><th>Model</th><th>Status</th><th>Submitted</th><th></th></tr></thead>
        <tbody>`;
      const entries = [...jobs.entries()].reverse();
      for (const [jobId, job] of entries) {
        const t = new Date(job.submitted_at * 1000).toLocaleTimeString();
        let statusCls = "status-running";
        if (job.status === "complete") statusCls = "status-complete";
        else if (job.status === "failed") statusCls = "status-failed";

        let statusText = job.status;
        if (job.status === "running") {
          statusText = job.progress || "running...";
        } else if (job.status === "failed") {
          const msg = job.progress || "failed";
          statusText = msg.length > 60 ? msg.slice(0, 60) + "..." : msg;
        }

        let actionBtn = "";
        if (job.status === "complete") {
          actionBtn = `<button class="btn-sm" onclick="showDetail('${jobId}')">View</button>`;
        } else if (job.status === "failed") {
          actionBtn = `<button class="btn-sm" onclick="showLogs('${jobId}')" style="background:#dc2626;">Logs</button>`;
        } else if (job.status === "running" && isAdmin) {
          actionBtn = `<button class="btn-sm" onclick="showLogs('${jobId}')" style="background:#7c3aed;">Live</button>`;
        }
        html += `<tr>
          <td>${job.paper_id}</td>
          <td>${job.model || ""}</td>
          <td class="${statusCls}">${statusText}</td>
          <td>${t}</td>
          <td>${actionBtn}</td>
        </tr>`;
      }
      html += `</tbody></table>`;
      area.innerHTML = html;
    }

    function showDetail(jobId) {
      const job = jobs.get(jobId);
      if (!job) return;
      if (!job.results) {
        fetch("/api/status/" + jobId).then(r => r.json()).then(data => {
          if (data.results) {
            job.results = data.results;
            job.cost_usd = data.cost_usd;
            job.duration_s = data.duration_s;
            job.model = data.model || job.model;
            renderDetail(jobId, job);
            showDetailPage();
          }
        });
        return;
      }
      renderDetail(jobId, job);
      showDetailPage();
    }

    function showLogs(jobId) {
      const job = jobs.get(jobId);
      if (!job) return;

      // Always fetch fresh status for live logs
      fetch("/api/status/" + jobId).then(r => r.json()).then(data => {
        job.error_log = data.error_log || job.error_log;
        job.live_log = data.live_log || "";
        job.progress = data.progress || job.progress;
        job.elapsed_s = data.elapsed_s;
        job.rated_count = data.rated_count;
        job.total_items = data.total_items;
        job.work_dir_files = data.work_dir_files;
        job.status = data.status || job.status;
        renderLogs(jobId, job);
        showDetailPage();
      });
    }

    function renderLogs(jobId, job) {
      const isRunning = job.status === "running";
      const title = isRunning ? `${job.paper_id} — Live Logs` : `${job.paper_id} — Error Log`;
      const statusColor = isRunning ? "#d97706" : "#dc2626";
      const statusLabel = isRunning ? "running" : "failed";

      document.getElementById("detail-title").textContent = title;

      let metaHtml = `<span>Status: <strong style="color:${statusColor};">${statusLabel}</strong></span>`;
      if (job.model) metaHtml += `<span>Model: <strong>${job.model}</strong></span>`;
      if (job.elapsed_s) metaHtml += `<span>Elapsed: <strong>${Math.round(job.elapsed_s)}s</strong></span>`;
      if (job.rated_count) metaHtml += `<span>Progress: <strong>${job.rated_count}/${job.total_items || "?"}</strong></span>`;
      document.getElementById("detail-meta").innerHTML = metaHtml;

      // Work dir files
      let filesHtml = "";
      if (job.work_dir_files && Object.keys(job.work_dir_files).length > 0) {
        filesHtml = `<div style="margin-bottom:12px;"><strong>Work directory:</strong><ul style="margin:4px 0 0 20px;font-size:0.85rem;">`;
        for (const [name, size] of Object.entries(job.work_dir_files)) {
          const kb = (size / 1024).toFixed(1);
          filesHtml += `<li>${name} (${kb} KB)</li>`;
        }
        filesHtml += `</ul></div>`;
      }

      document.getElementById("detail-trace-link").innerHTML = isRunning
        ? `<button class="btn-sm" onclick="showLogs('${jobId}')" style="background:#7c3aed;">Refresh</button>`
        : "";

      const container = document.getElementById("detail-results");
      const logText = job.live_log || job.error_log || job.progress || "No details available";
      const escaped = logText.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      container.innerHTML = `${filesHtml}<div class="error-log">${escaped}</div>`;
    }

    function renderDetail(jobId, job) {
      document.getElementById("detail-title").textContent = job.paper_id;

      // Meta line
      const meta = document.getElementById("detail-meta");
      let metaHtml = "";
      if (job.model) metaHtml += `<span>Model: <strong>${job.model}</strong></span>`;
      if (job.cost_usd != null) metaHtml += `<span>Cost: <strong>$${job.cost_usd.toFixed(4)}</strong></span>`;
      if (job.duration_s != null) metaHtml += `<span>Duration: <strong>${Math.round(job.duration_s)}s</strong></span>`;
      meta.innerHTML = metaHtml;

      // Trace download link
      const traceDiv = document.getElementById("detail-trace-link");
      traceDiv.innerHTML = `<a class="trace-link" href="/api/trace/${jobId}" download>Download trace JSON</a>`;

      const container = document.getElementById("detail-results");

      const s = job.results.summary;
      let html = `<div class="summary">
        <div class="summary-item"><strong>${s.total_items}</strong> items</div>
        <div class="summary-item rating-yes">Yes: ${s.yes}</div>
        <div class="summary-item rating-no">No: ${s.no}</div>
        <div class="summary-item rating-partial">Partial: ${s.partial}</div>
        <div class="summary-item rating-na">NA: ${s.na}</div>
      </div>`;
      html += `<table class="results-table">
        <thead><tr><th>Item</th><th>Rating</th><th>Comments</th></tr></thead>
        <tbody>`;
      for (const a of job.results.assessments) {
        const rating = a.rating || "—";
        const cls = a.rating ? "rating-" + a.rating.toLowerCase() : "";
        html += `<tr><td>${a.item_id}</td><td class="${cls}">${rating}</td><td>${a.comments || ""}</td></tr>`;
      }
      html += `</tbody></table>`;
      container.innerHTML = html;
    }

    // --- Init ---
    checkAuth();
    loadJobs();
  </script>
</body>
</html>
